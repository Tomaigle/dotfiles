[mgr]
show_hidden = true

[opener]
edit_dir = [
  { run = 'wezterm cli spawn --cwd %s -- nvim -c "lua Snacks.explorer()"', block = true, desc = "nvim + snacks explorer (tab)", for = "unix" },
]

edit = [
  { run = 'wezterm cli spawn --cwd %d -- nvim %s', block = true, desc = "nvim (tab)", for = "unix" },
]

extract = [
  { run = 'ya pub extract --list %s', desc = "Extract here", for = "unix" },
]

open_gui = [
  { run = 'xdg-open %s', orphan = true, desc = "Open in default app", for = "unix" },
]

dolphin = [
  { run = 'dolphin %s', orphan = true, desc = "Open in Dolphin", for = "unix" },
]

[open]
rules = [
  { url = "*/", use = [
    "edit_dir",
    "dolphin",
  ] },
  { url = "*.{zip,rar,7z,tar,gz,xz,zst,bz2}", use = [
    "extract",
  ] },
  { url = "*.{stp,step,stl}", use = [
    "open_gui",
  ] },
  { mime = "text/*", use = [
    "edit",
    "open_gui",
  ] },
  { mime = "application/{json,x-ndjson,javascript,x-shellscript,toml,xml}", use = [
    "edit",
    "open_gui",
  ] },
  { mime = "inode/x-empty", use = [
    "edit",
  ] },
  { mime = "{image,video,audio}/*", use = [
    "open_gui",
    "edit",
  ] },
  { url = "*", use = [
    "open_gui",
    "edit",
  ] },
]
